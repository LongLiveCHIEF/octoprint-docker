language: bash

os: linux
dist: bionic

env:
  - DOCKER_CLI_EXPERIMENTAL=enabled

addons:
  apt:
    packages:
      - docker-ce

before_install:
  - docker run --rm --privileged  docker/binfmt:a7996909642ee92942dcd6cff44b9b95f08dad64

script:
  - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME"
  - docker version
  - make prepare
  - make buildx-push
